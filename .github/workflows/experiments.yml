name: Reproduce probability experiments
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-reproduce.txt
      - run: python -m unittest -v test_experiment
      - run: python experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: probability-results
          path: results/
